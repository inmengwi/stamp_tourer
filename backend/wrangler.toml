name = "stamp-tourer-api"
main = "src/index.ts"
compatibility_date = "2025-02-20"

[vars]
JWT_ISSUER = "stamp-tourer"
ACCESS_TOKEN_TTL_SECONDS = "86400"
JWT_SECRET = "dev-secret-change-in-production"
CORS_ORIGINS = "https://stamp-tourer.pages.dev,https://*.stamp-tourer.pages.dev"
# AI_PROVIDER와 AI_MODEL은 Cloudflare 대시보드에서 설정합니다.
# wrangler.toml에 지정하면 배포 시 대시보드 값을 덮어쓰므로 여기에 두지 않습니다.
# 미설정 시 기본값: AI_PROVIDER=gemini, AI_MODEL=gemini-2.5-flash

[[d1_databases]]
binding = "DB"
database_name = "stamp-tourer-db"
database_id = "83540ba9-ffb2-4e9a-b87b-e0c880c08e94"
migrations_dir = "migrations"

[observability.logs]
enabled = true
